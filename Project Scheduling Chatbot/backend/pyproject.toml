[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Maria Ashfaq", email = "maria.ashfaq620@gmail.com" }
]
requires-python = ">=3.12"

dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.162.5",
    "langchain>=1.4.8",
    "langchain-core>=1.7.4",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.3",
    "langchain-pinecone>=0.2.13",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.19",
    "langsmith>=0.14.17",
    "pinecone>=7,<8",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.14.3",
    "pyjwt>=2.15.1",
    "pypdf>=7.0.1",
    "python-multipart>=0.0.33",
    "sentence-transformers>=6.2.0",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]